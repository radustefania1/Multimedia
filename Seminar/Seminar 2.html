<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Agenda</title>

    <style type="text/css">
        body, input {
            font-family:Tahoma, sans-serif;
            font-size: 11pt;
        }
        body {
        margin: 0;
        padding: 16px;
        }

        h1{
            color: white;
            background-color: navy;
            padding: 16px;
            margin: -16px -16px 20px -16px;
            margin-bottom: 20px;
        }

        caption{
            padding: 8px 0;
            font-size: 13pt;
            font-weight: bold;
            text-align: left;
            color: navy;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid gainsboro;
            text-align: left;
        }

        th {
            border-bottom: 2px solid navy;
            color: navy;
        }

        tfoot td {
            font-style: italic;
            color: gray;
            border-bottom:none;
        }

        table{
            border-collapse: collapse;
        }

        form{
            float: right;
            width: 30%;
            padding: 16px;
            background-color:lavender;
            border-top: 4px solid navy;
        }

        input {
            padding: 4px 6px;
           border: 1px solid darkgray;
        }

        #btnAdauga {
            background-color: navy;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 6px;
            padding: 8px;
        }

        table {
        float: left;
        width:60%;
        }

        label {
        display:block;
        float:left;
        width:30%;
        clear:both;
        margin-bottom:10px;
        padding: 4px 0;
        }

        input {
        display:block;
        float: right;
        width:60%;
        margin-bottom:10px;
        }

       
    </style>

</head>


<body>
    <h1>Agenda telefonica</h1>

    <table>

        <caption>Lista persoane</caption>

        <thead>
            <tr>
                <th>Nume</th>
                <th>Prenume</th>
                <th>Telefon</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Radu</td>
                <td>Stefania</td>
                <td>0736572916</td>
            </tr>

            <tr>
                <td>Popescu</td>
                <td>Mara</td>
                <td>0774177816</td>
            </tr>

            <tr>
                <td>Vasilescu</td>
                <td>Maria</td>
                <td>0734173462</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Numar persoane: 3</td>
            </tr>
        </tfoot>

    </table>

    <form>
        <label for="nume">Nume</label>
        <input id="nume">

        <label for="prenume">Prenume</label>
        <input id="prenume">

        <label for="telefon">Telefon</label>
        <input id="telefon">

        <input type="button" id="btnAdauga"
               value="Adauga">
    </form>
</body>


</html>
